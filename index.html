<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Deductive Node 1 Demo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- [온보딩] 오디오 정책 해제 및 가동 레이어 -->
    <div id="startOverlay" class="start-overlay">
        <div class="start-card">
            <h2>시제 엣지 온보딩 레슨</h2>
            <p>아침에 눈을 떠보니 밖에서 은은한 빗소리가 들려옵니다.</p>
            <button class="start-btn" onclick="startLesson()">체험 시작하기</button>
        </div>
    </div>

    <!-- NODE 1: 아파트 베란다 맥락 (현재진행) -->
    <div id="node-1" class="node-container">
        <!-- 타겟 노드 표현 (처음엔 숨김) -->
        <div id="targetSentence" class="target-sentence">"It's raining outside right now."</div>
        
        <!-- 베란다 창문 (인터랙션 구역) -->
        <div id="windowFrame" class="window-frame" onclick="triggerNode1()">
            <div class="rain-bg" id="rainBg"></div>
            <div class="curtain curtain-left"></div>
            <div class="curtain curtain-right"></div>
            <div class="guide-hint">커튼을 열어 확인하세요</div>
        </div>
        
        <!-- 검증용 CCQ 패널 (커튼이 열리면 등장) -->
        <div id="ccqPanel" class="ccq-panel">
            <div class="ccq-title">[CCQ] Is it raining NOW?</div>
            <button class="ccq-btn" onclick="finishDemo()">Yes, right now!</button>
        </div>
    </div>

    <!-- NODE 2: 교실 안 상황 (과거 시제 엣지) -->
    <div id="node-2" class="node-container is-hidden">
        <div class="classroom-viewport">
            <!-- 맑아진 하늘과 햇살 연출 -->
            <div class="sunny-sky"></div>
            <div class="sunlight-beam"></div>
            
            <!-- 교실 창문 프레임 및 과거의 흔적(물웅덩이/빗잔상) -->
            <div class="classroom-window-frame">
                <div class="window-glass">
                    <!-- 간헐적으로 흘러내리는 빗방울 잔상 -->
                    <div class="rain-streak streak-1"></div>
                    <div class="rain-streak streak-2"></div>
                </div>
            </div>
            
            <!-- 교실 바닥/창틀의 물웅덩이 인터랙션 영역 -->
            <div class="water-puddles-container" id="puddle-trigger">
                <div class="puddle puddle-1"></div>
                <div class="puddle puddle-2"></div>
                <span class="puddle-ripple"></span>
                <div class="cognitive-hint">The ground is still wet...</div>
            </div>
        </div>
        
        <!-- 교육 콘텐츠 및 인지언어학 타겟 표현 영역 -->
        <div class="educational-panel">
            <div class="target-sentence-box">
                <h2 class="target-sentence">"It <span class="tense-edge-highlight">was raining</span> this morning."</h2>
            </div>
            
            <!-- 노드 2 전용 개념 검증 질문 (CCQ) 패널 -->
            <div class="ccq-panel-node2" id="node2-ccq">
                <p class="ccq-question">Is it raining inside the classroom <span class="time-anchor">right now</span>?</p>
                <div class="ccq-options">
                    <button class="btn-ccq btn-wrong" onclick="handleNode2Wrong()">Yes, it is.</button>
                    <button class="btn-ccq btn-correct" onclick="handleNode2Correct()">No, it was raining this morning!</button>
                </div>
                <div id="node2-feedback" class="ccq-feedback is-hidden"></div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
