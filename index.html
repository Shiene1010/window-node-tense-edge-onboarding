<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Deductive Node 1 Demo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 🌟 [추가] 초기 빗소리 인지를 강제하고 오디오 정책을 해제하는 온보딩 시작 레이어 -->
    <div id="startOverlay" class="start-overlay">
        <div class="start-card">
            <h2>🌧️ 시제 엣지 온보딩 레슨</h2>
            <p>아침에 눈을 떠보니 밖에서 은은한 빗소리가 들려옵니다.</p>
            <button class="start-btn" onclick="startLesson()">체험 시작하기</button>
        </div>
    </div>

    <!-- 타겟 노드 표현 (처음엔 숨김) -->
    <div id="targetSentence" class="target-sentence">"It's raining outside right now."</div>

    <!-- 베란다 창문 (인터랙션 구역) -->
    <div id="windowFrame" class="window-frame" onclick="triggerNode1()">
        <div class="rain-bg" id="rainBg"></div>
        <div class="curtain curtain-left"></div>
        <div class="curtain curtain-right"></div>
        <div class="guide-hint">👇 커튼을 열어 확인하세요</div>
    </div>

    <!-- 검증용 CCQ 패널 (커튼이 열리면 등장) -->
    <div id="ccqPanel" class="ccq-panel">
        <div class="ccq-title">💡 [CCQ] Is it raining NOW?</div>
        <button class="ccq-btn" onclick="finishDemo()">Yes, right now!</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
